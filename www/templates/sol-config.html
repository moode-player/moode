<div id="container">
<div class="container">
	<h1 class="ren-config">Spotify Soloist</h1>

	<!-- TEMPLATE -->

    <form class="form-horizontal" action="" method="post">
    	<legend>Settings
			<button class="legend-config btn btn-medium btn-primary btn-submit" type="submit" name="save" value="1">Save</button>
		</legend>

		<div class="control-group">
			<label class="control-label" for="soloistkey">API key</label>
			<div class="controls">
				<input class="config-input-large" type="password" pattern="[A-Za-z0-9_\-]{16,128}" id="soloistkey" name="soloistkey" value="" placeholder="$_soloistkey_placeholder">
				<a aria-label="Help" class="config-info-toggle" data-cmd="info-soloistkey" href="#notarget"><i class="fa-regular fa-sharp fa-info-circle"></i></a>
				<a class="show-hide-password" href="#notarget" data-id="soloistkey"><i class="fa-regular fa-sharp fa-eye"></i></a>
				$_soloistkey_status
				<span id="info-soloistkey" class="config-help-info">
					Visit <a href="https://developer.spotify.com/documentation/soloist/tutorials/getting-started" class="target-blank-link" target="_blank">Spotify for Developers</a>
					to generate an API key. Login with your Spotify Premium account credentials.
				</span>
			</div>

			<label class="control-label" for="initial-volume">Initial volume</label>
			<div class="controls">
				<input class="config-input-large" type="number" min="0" max="100" step="1" id="initial-volume" name="config[initial_volume]" value="$_select[initial_volume]" required>
				<a aria-label="Help" class="config-info-toggle" data-cmd="info-initial-volume" href="#notarget"><i class="fa-regular fa-sharp fa-info-circle"></i></a>
				<span id="info-initial-volume" class="config-help-info">
					The initial volume on the client App after it connects, from 0 to 100%.
				</span>
			</div>
		</div>
	</form>
</div>
</div>
