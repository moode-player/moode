<div>
	<div id="dashboard-toolbar">
		<div class="btn-toolbar dashboard-toolbar-row">
			<div class="btn-group">
				<button aria-label="Refresh" class="btn btn-cmd dashboard-cmd" data-cmd="discover_players_update_cache"><i class="fa-solid fa-sharp fa-magnifying-glass-plus"></i><span>Refresh</span></button>
				<button aria-label="Remove" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel dashboard-cmd-confirm $_ctl_hide" data-cmd="remove_players" disabled><i class="fa-regular fa-sharp fa-trash"></i><span>Remove</span></button>
			</div>
			<a aria-label="Help" class="info-toggle" data-cmd="info-dashboard-command" href="#notarget"><i class="fa-regular fa-sharp fa-info-circle"></i></a>
			<div class="btn-group $_ctl_hide">
				<button aria-label="Restart" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel dashboard-cmd-confirm" data-cmd="reboot" disabled><i class="dashboard-red-menu-icon fa-solid fa-sharp fa-power-off"></i><span>Restart</span></button>
				<button aria-label="Shutdown" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel dashboard-cmd-confirm" data-cmd="poweroff" disabled><i class="dashboard-red-menu-icon fa-solid fa-sharp fa-power-off"></i><span>Shutdown</span></button>
			</div>
		</div>
		<div class="btn-toolbar dashboard-toolbar-row $_ctl_hide">
			<div class="btn-group">
				<button aria-label="Play" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel" data-cmd="play" disabled><i class="fa-solid fa-sharp fa-play"></i><span>Play</span></button>
				<button aria-label="Pause" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel" data-cmd="pause" disabled><i class="fa-solid fa-sharp fa-pause"></i><span>Pause</span></button>
				<button aria-label="Stop" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel" data-cmd="stop" disabled><i class="fa-solid fa-sharp fa-stop"></i><span>Stop</span></button>
				<button aria-label="Previous" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel" data-cmd="prev" disabled><i class="fa-solid fa-sharp fa-step-backward"></i><span>Prev</span></button>
				<button aria-label="Next" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel" data-cmd="next" disabled><i class="fa-solid fa-sharp fa-step-forward"></i><span>Next</span></button>
			</div>
			<div class="btn-group">
				<button aria-label="Update library" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel" data-cmd="update_library" disabled><i class="fa-solid fa-sharp fa-sync"></i><span>Library</span></button>
				<button aria-label="Regen thumbnails" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel" data-cmd="regen_thmcache" disabled><i class="fa-solid fa-sharp fa-file-image"></i><span>Thumbs</span></button>
				<button aria-label="Refresh screen" class="btn btn-cmd dashboard-cmd dashboard-cmd-sel" data-cmd="refresh_screen" disabled><i class="fa-solid fa-sharp fa-redo"></i><span>Screen</span></button>
			</div>
			<div class="btn-group">
				<button id="dashboard-check-uncheck-all" aria-label="Select all" class="btn btn-cmd"><i class="fa-regular fa-sharp fa-square-check"></i><span>Select all</span></button>
			</div>
		</div>
		<span id="info-dashboard-command" class="help-block hide">
			Select players then click a command, or click a player to open its WebUI in a new tab.<br>
			Remove, Restart and Shutdown need a second click to confirm.<br>
			The indicator icons on a player have the following meaning:<br>
			- <b>Red X:</b> Offline<br>
			- <b>Speaker:</b> Multiroom receiver<br>
			- <b>Play:</b> Multiroom sender
		</span>
		<span id="dashboard-submit-confirmed" class="modal-btn-after"></span>
	</div>

	<div id="dashboard">
		<ul id="dashboard-ul">
			$_players
		</ul>
	</div>
</div>
